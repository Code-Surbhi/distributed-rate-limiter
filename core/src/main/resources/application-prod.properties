# Production Configuration

# Server
server.port=8080

# Application
spring.application.name=rate-limiter-core

# Redis Configuration (will be set via environment variables)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000
spring.data.redis.jedis.pool.max-active=20
spring.data.redis.jedis.pool.max-idle=10
spring.data.redis.jedis.pool.min-idle=5

# Logging
logging.level.root=INFO
logging.level.com.ratelimiter=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator (health check endpoint)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized